name: Patrulha da cobrinha

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar a cobrinha nas cores do Robin
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/robin-snake-dark.svg?color_snake=#FFC93C&color_dots=#161b22,#4a1216,#8a1a20,#c4202a,#ff4d4d
            dist/robin-snake-light.svg?color_snake=#E0262B&color_dots=#ebedf0,#c6e9cf,#8fd19e,#2e9d4a,#1e6b33

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: atualiza a cobrinha"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
